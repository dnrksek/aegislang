[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aegislang"
version = "0.1.0"
description = "AegisLang experimental programming language"
requires-python = ">=3.11"

[project.scripts]
aegis = "aegis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
